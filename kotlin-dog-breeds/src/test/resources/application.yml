spring:
  cache:
    caffeine:
      spec: expireAfterAccess=600s
    cache-names: breeds
  h2:
    console:
      enabled: true
      path: /h2-console
  r2dbc:
    url: r2dbc:h2:file:///./data/testdb;MODE=PostgreSQL
    #jdbc:h2:mem:testdb
    username: sa
    password:
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
management:
  endpoint:
    prometheus:
      enabled: true
    metrics:
      enabled: true
  endpoints:
    web:
      exposure:
        include: [ "prometheus", "metrics"]
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

